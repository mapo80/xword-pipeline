name: CI

on:
  push:
    branches: [main, italiano]
  pull_request:
    branches: [main, italiano]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fill-engine:
    name: fill-engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fill-engine
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fill-engine

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --release -- -D warnings

      - name: cargo build (release)
        run: cargo build --workspace --release

      - name: cargo test
        run: cargo test --workspace --release

      - name: xfill-host (C, -Werror) against the library
        run: |
          host/build.sh target/release
          # protocol smoke test: the host loads the library and answers HELLO
          python3 - <<'PY'
          import struct, subprocess
          p = subprocess.Popen(["target/release/xfill-host", "target/release/libxfill.so"],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          kind, _, rc, la = struct.unpack("<BIiI", p.stdout.read(13))
          version = p.stdout.read(la)
          assert (kind, rc) == (0, 0), (kind, rc)
          print("xfill-host ok, engine", version.decode())
          p.stdin.close()
          assert p.wait(10) == 0
          PY

  ffi:
    name: xfill-ffi (coverage, header)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fill-engine
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fill-engine

      - name: Tools (cargo-llvm-cov, cbindgen)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cbindgen@0.29.4

      - name: Coverage of xfill-ffi (>= 90% lines, blocking)
        run: cargo llvm-cov --release -p xfill-ffi --summary-only --fail-under-lines 90

      - name: C header up to date
        working-directory: fill-engine/crates/xfill-ffi
        run: |
          cbindgen --config cbindgen.toml --output include/xfill.h
          git diff --exit-code -- include/xfill.h

  dotnet:
    name: Cruciverba.Xfill (.NET, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fill-engine

      - name: Native library and engine host
        working-directory: fill-engine
        run: |
          cargo build --release -p xfill-ffi
          host/build.sh target/release

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: fill-engine/dotnet/global.json

      - name: dotnet test (coverage >= 90% lines, blocking)
        working-directory: fill-engine/dotnet
        run: >
          dotnet test
          --coverlet --coverlet-include "[Cruciverba.Xfill]*"
          --coverlet-output-format cobertura
          --coverlet-threshold 90 --coverlet-threshold-type line --coverlet-threshold-stat Total
