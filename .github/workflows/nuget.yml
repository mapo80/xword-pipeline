name: NuGet (Cruciverba.Xfill)

# Native engine for 6 RIDs → .NET tests on Windows, Linux and macOS with the
# library just built → one package with every native → GitHub Packages at the
# xfill-v* tags.

on:
  push:
    branches: [main]
    tags: ['xfill-v*']
    paths:
      - 'fill-engine/**'
      - '.github/workflows/nuget.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fill-engine/**'
      - '.github/workflows/nuget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  native:
    name: native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc, lib: xfill.dll, dotnet: true }
          - { rid: win-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, lib: xfill.dll, dotnet: true }
          - { rid: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, lib: libxfill.so, dotnet: true }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, lib: libxfill.so, dotnet: true }
          - { rid: osx-arm64, os: macos-latest, target: aarch64-apple-darwin, lib: libxfill.dylib, dotnet: true }
          - { rid: osx-x64, os: macos-15-intel, target: x86_64-apple-darwin, lib: libxfill.dylib, dotnet: true }
    defaults:
      run:
        shell: bash
        working-directory: fill-engine
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fill-engine
          key: ${{ matrix.target }}

      - name: cargo test
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Native library
        run: cargo build --release -p xfill-ffi --target ${{ matrix.target }}

      - name: .NET SDK
        if: matrix.dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: fill-engine/dotnet/global.json

      - name: .NET tests (coverage >= 90% lines)
        if: matrix.dotnet
        working-directory: fill-engine/dotnet
        run: >
          dotnet test
          -p:XfillRustTarget=${{ matrix.target }}
          --coverlet --coverlet-include "[Cruciverba.Xfill]*"
          --coverlet-output-format cobertura
          --coverlet-threshold 90 --coverlet-threshold-type line --coverlet-threshold-stat Total

      - name: Upload native library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: fill-engine/target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  pack:
    name: pack
    needs: native
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: fill-engine/dotnet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: fill-engine/dotnet/global.json

      - name: Native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: fill-engine/dotnet/native

      - name: Lay out runtimes/<rid>/native
        run: |
          for dir in native/native-*; do
            rid="${dir#native/native-}"
            mkdir -p "runtimes/$rid/native"
            cp "$dir"/* "runtimes/$rid/native/"
          done
          find runtimes -type f | sort

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/xfill-v* ]]; then
            version="${GITHUB_REF_NAME#xfill-v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: dotnet pack
        run: dotnet pack Cruciverba.Xfill -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Check the six natives are in the package
        run: |
          pkg="artifacts/Cruciverba.Xfill.${{ steps.version.outputs.version }}.nupkg"
          for f in win-x64/native/xfill.dll win-arm64/native/xfill.dll \
                   linux-x64/native/libxfill.so linux-arm64/native/libxfill.so \
                   osx-x64/native/libxfill.dylib osx-arm64/native/libxfill.dylib; do
            unzip -l "$pkg" | grep -q "runtimes/$f" || { echo "missing runtimes/$f"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: fill-engine/dotnet/artifacts/*.nupkg
          if-no-files-found: error

  installed:
    name: package on ${{ matrix.os }}
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: fill-engine/dotnet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: fill-engine/dotnet/global.json

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: fill-engine/dotnet/artifacts

      - name: Generate a 22 × 12 with the installed package
        run: dotnet run --project examples/Cruciverba.Xfill.Example -c Release -p:XfillPackageVersion=${{ needs.pack.outputs.version }}

  publish:
    name: publish to GitHub Packages
    if: startsWith(github.ref, 'refs/tags/xfill-v')
    needs: [pack, installed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      - name: dotnet nuget push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/mapo80/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
