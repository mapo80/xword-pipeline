[workspace]
resolver = "2"
members = ["crates/xfill-core", "crates/xfill-cli", "crates/xfill-ffi", "crates/xfill-perf"]

[workspace.package]
edition = "2021"
version = "0.1.1"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# release + debug symbols, for the profilers (see docs/prestazioni.md)
[profile.profiling]
inherits = "release"
debug = true
