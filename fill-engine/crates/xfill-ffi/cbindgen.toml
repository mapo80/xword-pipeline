# Header of the C interface: cbindgen --config cbindgen.toml --output include/xfill.h
language = "C"
header = "/* C interface of the xfill crossword engine. Generated by cbindgen from src/lib.rs: do not edit. */"
include_guard = "XFILL_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true

[export]
include = ["XfillWordlist"]
exclude = ["XfillCancelFlag"]

[export.rename]
# the caller's flag: an int written from other threads while the call runs
"XfillCancelFlag" = "volatile int32_t"
